<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 수집 현황</title><link rel="stylesheet" href="style.css"><header><h1>데이터 수집 현황</h1></header><main><p id="state">확인 중...</p><p>원천: 건강보험심사평가원 / 공공데이터포털</p><p>수집 기준일·최종 성공시각·기관 수·가격 건수를 검증 후 공개합니다.</p><a href="./">서비스로 돌아가기</a></main><script>fetch('data/status.json',{cache:'no-store'}).then(r=>r.json()).then(x=>document.getElementById('state').textContent='상태: '+x.status+' / 기관: '+x.facility_count+' / 가격: '+x.price_count+' / 마지막 성공: '+(x.last_success||'없음')).catch(()=>document.getElementById('state').textContent='상태 미확인')</script></html>
